[project]
name = "multiagentx"
version = "0.1.0"
description = "Execução de tarefas no Termux, com orquestrador e modelo local."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
articles = ["trafilatura>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
multiagentx = "multiagentx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
